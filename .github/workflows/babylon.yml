name: Babylon

on:
  push:
    paths: ["Babylon/**", ".github/workflows/babylon.yml"]
  pull_request:
    paths: ["Babylon/**", ".github/workflows/babylon.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-clang
            runs-on: ubuntu-24.04
            configure: "-G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug"
          - name: linux-gcc
            runs-on: ubuntu-24.04
            configure: "-G Ninja -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug"
          - name: linux-gcc-sanitize
            runs-on: ubuntu-24.04
            configure: "-G Ninja -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug -DBABYLON_SANITIZE=ON"
          - name: macos
            runs-on: macos-15-intel
            configure: "-G Ninja -DCMAKE_BUILD_TYPE=Debug"
          - name: windows-msvc
            runs-on: windows-2025-vs2026
            configure: '-G "Visual Studio 18 2026" -A x64'
          - name: windows-msvc-x86
            runs-on: windows-2025-vs2026
            configure: '-G "Visual Studio 18 2026" -A Win32'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and SDL3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libdrm-dev libgbm-dev libdecor-0-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake -S Babylon -B build ${{ matrix.configure }} --graphviz=build/graph.dot
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Check dependency graph
        if: runner.os != 'Windows'
        run: python3 Babylon/tools/check_graph.py build/graph.dot Babylon/allowed-deps.txt
      - name: Check dependency graph (Windows)
        if: runner.os == 'Windows'
        run: python Babylon/tools/check_graph.py build/graph.dot Babylon/allowed-deps.txt
