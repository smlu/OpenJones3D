# CMake build and test workflow for DirectX 9
name: DirectX 9 Build and Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-2025-vs2026
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            qol_improvements: "ON"
            runtime_guards: "OFF"
            profile: release-qol
          - os: windows-2025-vs2026
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            qol_improvements: "OFF"
            runtime_guards: "ON"
            profile: legacy-hardened
          - os: windows-2025-vs2026
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            qol_improvements: "OFF"
            runtime_guards: "OFF"
            profile: legacy
          - os: windows-2025-vs2026
            c_compiler: cl
            cpp_compiler: cl
            build_type: Debug
            qol_improvements: "ON"
            runtime_guards: "OFF"
            profile: debug-qol

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
    
    # Direct3D 9 headers, import libraries and FXC come from the preinstalled Windows SDK.
    - name: Configure CMake (${{ matrix.profile }})
      shell: pwsh
      run: |
        cmake -G "Visual Studio 18 2026" -B "${{ steps.strings.outputs.build-output-dir }}" `
          -A Win32 `
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} `
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DJONES3D_USE_DIRECTX9=ON `
          -DJONES3D_QOL_IMPROVEMENTS=${{ matrix.qol_improvements }} `
          -DJONES3D_RUNTIME_GUARDS=${{ matrix.runtime_guards }} `
          -DJONES3D_BUILD_TESTS=ON `
          -DJONES3D_BUILD_SYSTEM_TESTS=OFF `
          -DJONES3D_ENABLE_POST_BUILD_COPY=OFF `
          -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Record test build revision
      shell: pwsh
      run: |
        $sourceSha = git rev-parse HEAD
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        @{
          source_sha = $sourceSha.Trim()
          source_dir = $env:GITHUB_WORKSPACE
          build_dir = "${{ steps.strings.outputs.build-output-dir }}"
          profile = "${{ matrix.profile }}"
          configuration = "${{ matrix.build_type }}"
        } | ConvertTo-Json | Set-Content -Encoding utf8 `
          "${{ steps.strings.outputs.build-output-dir }}/ci-test-build.json"

    - name: Upload test build
      uses: actions/upload-artifact@v4
      with:
        name: dx9-${{ matrix.os }}-${{ matrix.profile }}
        path: ${{ steps.strings.outputs.build-output-dir }}
        retention-days: 7
        if-no-files-found: error
        overwrite: true

  test:
    name: Tests
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/test-dx9.yml

  build-status:
    name: DX9 Build
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
    - name: Check build matrix result
      env:
        CI_BUILD_RESULT: ${{ needs.build.result }}
      run: |
        echo "Build matrix result: $CI_BUILD_RESULT"
        test "$CI_BUILD_RESULT" = "success"

  test-status:
    name: DX9 Tests
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
    - name: Check test matrix result
      env:
        CI_TEST_RESULT: ${{ needs.test.result }}
      run: |
        echo "Tests matrix result: $CI_TEST_RESULT"
        test "$CI_TEST_RESULT" = "success"
