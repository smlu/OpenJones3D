# CMake build and test workflow for DirectX 6
name: DirectX 6 Build and Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-2025-vs2026
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            qol_improvements: "ON"
            runtime_guards: "OFF"
            profile: release-qol
          - os: windows-2025-vs2026
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            qol_improvements: "OFF"
            runtime_guards: "ON"
            profile: legacy-hardened
          - os: windows-2025-vs2026
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            qol_improvements: "OFF"
            runtime_guards: "OFF"
            profile: legacy
          - os: windows-2025-vs2026
            c_compiler: cl
            cpp_compiler: cl
            build_type: Debug
            qol_improvements: "ON"
            runtime_guards: "OFF"
            profile: debug-qol

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Download DirectX 6.1 SDK
      shell: pwsh
      run: |
        $url = "https://archive.org/download/dx61sdkimage/dx61sdkimage.exe"
        $output = "${{ github.workspace }}/dx61sdk.exe"
        Write-Host "Downloading DirectX 6.1 SDK..."
        Invoke-WebRequest -Uri $url -OutFile $output
        Write-Host "Download complete"

    - name: Extract and Setup DirectX 6.1 SDK
      shell: pwsh
      run: |
        $sdkExe = "${{ github.workspace }}/dx61sdk.exe"
        $extractPath = "${{ github.workspace }}/dx61sdk_temp"
        $repoIncludePath = "${{ github.workspace }}/Libs/external/DirectX61c/include/DirectX6"
        $repoLibPath = "${{ github.workspace }}/Libs/external/DirectX61c/lib"
        
        # Create extraction directory
        New-Item -ItemType Directory -Force -Path $extractPath
        New-Item -ItemType Directory -Force -Path $repoIncludePath
        New-Item -ItemType Directory -Force -Path $repoLibPath
        
        # Extract using 7-Zip (pre-installed on GitHub runners)
        Write-Host "Extracting DirectX 6.1 SDK with 7-Zip..."
        & "C:\Program Files\7-Zip\7z.exe" x $sdkExe -o"$extractPath" -y
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        
        Write-Host "`nExtracted directory structure:"
        Get-ChildItem -Path $extractPath -Recurse -Depth 2 | Format-Table FullName
        
        # Find and copy include files
        Write-Host "`nSearching for include files..."
        $includeSource = Get-ChildItem -Path $extractPath -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq "include" } | Select-Object -First 1
        if ($includeSource) {
          Write-Host "Found include directory at: $($includeSource.FullName)"
          Copy-Item -Path "$($includeSource.FullName)\*" -Destination $repoIncludePath -Recurse -Force
          Write-Host "Include files copied to: $repoIncludePath"
        } else {
          # Try alternative: look for header files directly
          Write-Host "Looking for header files directly..."
          $headerFiles = Get-ChildItem -Path $extractPath -Recurse -Filter "*.h" -ErrorAction SilentlyContinue
          if ($headerFiles) {
            $headerFiles | ForEach-Object { Copy-Item $_.FullName -Destination $repoIncludePath -Force }
            Write-Host "Copied $($headerFiles.Count) header files"
          } else {
            Write-Error "Could not find include files in extracted SDK"
            exit 1
          }
        }
        
        # Find and copy lib files (x86 libraries)
        Write-Host "`nSearching for library files..."
        $libSource = Get-ChildItem -Path $extractPath -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "lib" } | Select-Object -First 1
        if ($libSource) {
          Write-Host "Found lib directory at: $($libSource.FullName)"
          Copy-Item -Path "$($libSource.FullName)\*.lib" -Destination $repoLibPath -Force
          Write-Host "Library files copied to: $repoLibPath"
        } else {
          # Try alternative: look for .lib files directly
          Write-Host "Looking for .lib files directly..."
          $libFiles = Get-ChildItem -Path $extractPath -Recurse -Filter "*.lib" -ErrorAction SilentlyContinue
          if ($libFiles) {
            $libFiles | ForEach-Object { Copy-Item $_.FullName -Destination $repoLibPath -Force }
            Write-Host "Copied $($libFiles.Count) library files"
          } else {
            Write-Error "Could not find library files in extracted SDK"
            exit 1
          }
        }
        
        # List what we copied
        Write-Host "`nInclude files:"
        Get-ChildItem -Path $repoIncludePath | Format-Table Name
        Write-Host "`nLibrary files:"
        Get-ChildItem -Path $repoLibPath | Format-Table Name

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
    
    - name: Get DirectX 6 SDK Paths
      id: dx6_path
      shell: pwsh
      run: |
        $DX_INCLUDE = "${{ github.workspace }}/Libs/external/DirectX61c/include/DirectX6"
        $DX_LIB = "${{ github.workspace }}/Libs/external/DirectX61c/lib"
        
        Write-Host "DirectX 6 Include: $DX_INCLUDE"
        Write-Host "DirectX 6 Lib: $DX_LIB"
        
        echo "DX_INCLUDE=$DX_INCLUDE" >> $env:GITHUB_OUTPUT
        echo "DX_LIB=$DX_LIB" >> $env:GITHUB_OUTPUT

    - name: Configure CMake (${{ matrix.profile }})
      shell: pwsh
      run: |
        cmake -G "Visual Studio 18 2026" -B "${{ steps.strings.outputs.build-output-dir }}" `
          -A Win32 `
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} `
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DJONES3D_USE_DIRECTX9=OFF `
          -DJONES3D_QOL_IMPROVEMENTS=${{ matrix.qol_improvements }} `
          -DJONES3D_RUNTIME_GUARDS=${{ matrix.runtime_guards }} `
          -DJONES3D_BUILD_TESTS=ON `
          -DJONES3D_BUILD_SYSTEM_TESTS=OFF `
          -DJONES3D_ENABLE_POST_BUILD_COPY=OFF `
          -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Record test build revision
      shell: pwsh
      run: |
        $sourceSha = git rev-parse HEAD
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        @{
          source_sha = $sourceSha.Trim()
          source_dir = $env:GITHUB_WORKSPACE
          build_dir = "${{ steps.strings.outputs.build-output-dir }}"
          profile = "${{ matrix.profile }}"
          configuration = "${{ matrix.build_type }}"
        } | ConvertTo-Json | Set-Content -Encoding utf8 `
          "${{ steps.strings.outputs.build-output-dir }}/ci-test-build.json"

    - name: Upload test build
      uses: actions/upload-artifact@v4
      with:
        name: dx6-${{ matrix.os }}-${{ matrix.profile }}
        path: ${{ steps.strings.outputs.build-output-dir }}
        retention-days: 7
        if-no-files-found: error
        overwrite: true

  test:
    name: Tests
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/test-dx6.yml

  build-status:
    name: DX6 Build
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
    - name: Check build matrix result
      env:
        CI_BUILD_RESULT: ${{ needs.build.result }}
      run: |
        echo "Build matrix result: $CI_BUILD_RESULT"
        test "$CI_BUILD_RESULT" = "success"

  test-status:
    name: DX6 Tests
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
    - name: Check test matrix result
      env:
        CI_TEST_RESULT: ${{ needs.test.result }}
      run: |
        echo "Tests matrix result: $CI_TEST_RESULT"
        test "$CI_TEST_RESULT" = "success"
